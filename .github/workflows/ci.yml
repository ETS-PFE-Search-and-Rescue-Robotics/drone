name: CI

# Lightweight regression gate for the drone's own code (client/ + PFE_* ROS2
# packages). Does NOT touch the vendored voxl-portal tree. ROS2 runtime is not
# installed in CI, so checks are limited to syntax, lint, and the pure-Python
# unit tests under client/tests (transform math + UDP packet contract).

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: python -m pip install --upgrade pip flake8 pytest

      - name: Lint — real errors only (blocking)
        run: |
          flake8 --select=E9,F63,F7,F82 --show-source --statistics \
            client PFE_position PFE_camera_data

      - name: Lint — style (advisory, never fails the build)
        run: |
          flake8 --exit-zero --max-line-length=120 --statistics \
            client PFE_position PFE_camera_data

      - name: Byte-compile (syntax check, no imports)
        run: python -m compileall -q client PFE_position PFE_camera_data

      - name: Unit tests (transform + UDP contract)
        run: pytest -q
